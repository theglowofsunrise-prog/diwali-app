<title>Diwali Spin & Play</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Hind:wght@400;500;600;700&display=swap">
<style>
/* Layout: festival night stage — wheel as hero, a slim side column for name / result / winners, diyas framing the page, fireworks layered over everything. Single committed dark look. */
:root{
  --night:#1b1035; --night-2:#2a1a4f; --panel:#26184a;
  --marigold:#f6a821; --saffron:#e8601c; --rose:#d6336c; --clay:#b4532a; --clay-dark:#7a3216;
  --cream:#fff4dc; --muted:#c9b9e6; --line:rgba(246,168,33,.28);
  --display:"Yatra One","Hind",Georgia,serif;
  --body:"Hind",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--night);color:var(--cream);margin:0}
img{max-width:100%}
body{font-family:var(--body);font-size:16px;line-height:1.5;min-height:100vh;
  background:radial-gradient(1200px 700px at 50% -10%,var(--night-2),var(--night) 70%)}
.wrap{max-width:1040px;margin:0 auto;padding-block:16px 8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:1}
header{display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,28px);margin-bottom:6px}
.titles{text-align:center;display:grid;gap:2px}
.eyebrow{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--marigold);font-weight:600}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.1rem,6vw,3.6rem);line-height:1.05;margin:0;text-wrap:balance}
h1 span{color:var(--marigold)}
.sub{color:var(--muted);margin:0}
.toran{height:16px;margin:10px auto 22px;max-width:620px;
  background:radial-gradient(circle at 7px 4px,var(--marigold) 6px,transparent 7px) 0 0/24px 16px repeat-x,
             radial-gradient(circle at 19px 9px,var(--saffron) 4px,transparent 5px) 0 0/24px 16px repeat-x}

/* Diya */
.diya{display:inline-block;width:var(--s,64px);aspect-ratio:1/1}
.diya svg{width:100%;height:100%;overflow:visible}
.flame{transform-origin:50% 78%;animation:flick 1.6s ease-in-out infinite}
.diya:nth-child(2n) .flame{animation-duration:1.25s;animation-delay:-.4s}
.diya:nth-child(3n) .flame{animation-duration:1.9s;animation-delay:-.9s}
@keyframes flick{0%,100%{transform:scale(1,1) rotate(-2deg)}30%{transform:scale(.92,1.08) rotate(3deg)}60%{transform:scale(1.05,.94) rotate(-1deg)}}
.glow{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.diya-row{position:relative;z-index:2;margin-top:8px;display:flex;justify-content:space-around;align-items:flex-end;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));
  padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,rgba(27,16,53,.95),rgba(27,16,53,0));pointer-events:none;--s:clamp(40px,6vw,70px)}
@media (max-width:600px){.diya-row .diya:nth-child(n+7){display:none}}

/* Wheel stage */
.stage{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:32px;align-items:center}
@media (max-width:780px){.stage{grid-template-columns:1fr}}
.wheel-box{position:relative;width:100%;max-width:520px;margin:0 auto;aspect-ratio:1}
#wheel{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 0 0 8px var(--panel),0 0 0 11px var(--marigold),0 0 60px rgba(246,168,33,.35),0 20px 60px rgba(0,0,0,.45)}
.pointer{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:0;height:0;
  border-left:18px solid transparent;border-right:18px solid transparent;border-top:34px solid var(--cream);filter:drop-shadow(0 3px 3px rgba(0,0,0,.4));z-index:2}
.hub{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:22%;aspect-ratio:1;border-radius:50%;
  background:var(--night);border:4px solid var(--marigold);color:var(--marigold);font-family:var(--display);font-size:clamp(1rem,3.4vw,1.5rem);cursor:pointer}
.hub:disabled{cursor:default}
.side{display:grid;gap:16px;min-width:0}
.card{background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px;backdrop-filter:blur(4px)}
h2{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0;color:var(--marigold)}
button{font:inherit;cursor:pointer}
.btn{background:var(--saffron);color:var(--cream);border:0;border-radius:12px;padding:12px 22px;font-weight:700;font-size:1.1rem}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--cream);font-weight:600;font-size:.95rem;padding:9px 16px}
label{font-size:.85rem;color:var(--muted);font-weight:600;letter-spacing:.04em}
input,textarea{font:inherit;background:var(--night);color:var(--cream);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
textarea{min-height:220px;resize:vertical}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--cream);outline-offset:2px}
.result{text-align:center;min-height:100px;display:grid;place-content:center;gap:2px}
.result .who{color:var(--muted)}
.result .prize{font-family:var(--display);font-size:2.1rem;color:var(--marigold);line-height:1.15;text-wrap:balance}
.log{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:210px;overflow:auto}
.log li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:5px}
.log li span:last-child{color:var(--marigold);text-align:right}
.log small{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:.85rem;color:var(--muted);margin:0}

/* Host settings: hidden behind a small lamp button and a PIN */
.host-btn{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));z-index:30;
  width:34px;height:34px;border-radius:50%;border:1px solid transparent;background:transparent;color:var(--muted);opacity:.25;font-size:1rem}
.host-btn:hover,.host-btn:focus-visible{opacity:1;border-color:var(--line)}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(10,5,25,.75);display:grid;place-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{width:min(460px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:14px;max-height:90vh;overflow:auto}
.modal header{justify-content:space-between;margin:0}
.switch{display:flex;align-items:center;gap:10px;font-weight:600}
.switch input{width:auto;accent-color:var(--saffron);transform:scale(1.3)}
.err{color:#ff8fa8;margin:0;font-size:.9rem}

.music-btn{position:fixed;right:calc(max(10px,env(safe-area-inset-right,0px)) + 42px);top:calc(10px + env(safe-area-inset-top,0px));z-index:30;
  height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 80%,transparent);color:var(--muted);font-size:.9rem;font-weight:600;opacity:.45}
.music-btn:hover,.music-btn:focus-visible,.music-btn[aria-pressed="true"]{opacity:1;color:var(--marigold)}
input[type=range]{padding:0;accent-color:var(--saffron)}
input[type=file]{font-size:.9rem}
hr{border:0;border-top:1px dashed var(--line);margin:4px 0;width:100%}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
</style>

<canvas id="fx" aria-hidden="true"></canvas>
<button class="music-btn" id="musicBtn" aria-pressed="false" title="Play or pause music">♪ Music</button>
<button class="host-btn" id="hostBtn" title="Host settings" aria-label="Host settings">⚙</button>

<div class="wrap">
  <header>
    <span class="diya" style="--s:clamp(48px,8vw,84px)" data-diya></span>
    <div class="titles">
      <div class="eyebrow">Colleague celebration · Festival of Lights</div>
      <h1>Happy <span>Diwali</span>, team</h1>
      <p class="sub">Step up, spin the wheel and light up your luck.</p>
    </div>
    <span class="diya" style="--s:clamp(48px,8vw,84px)" data-diya></span>
  </header>
  <div class="toran" aria-hidden="true"></div>

  <section class="stage">
    <div class="wheel-box">
      <div class="pointer" aria-hidden="true"></div>
      <canvas id="wheel" width="1000" height="1000" aria-label="Prize wheel"></canvas>
      <button class="hub" id="hub" aria-label="Spin the wheel">Spin</button>
    </div>
    <div class="side">
      <div class="card">
        <label for="name">Colleague name (optional)</label>
        <input id="name" placeholder="e.g. Priya" autocomplete="off">
        <button class="btn" id="spinBtn">Spin the wheel</button>
        <div class="result" aria-live="polite" id="result">
          <div class="who">Who's feeling lucky?</div>
          <div class="prize">Shubh Deepavali</div>
        </div>
      </div>
      <div class="card">
        <h2>Lucky winners</h2>
        <ul class="log" id="log"></ul>
      </div>
    </div>
  </section>
</div>

<div class="diya-row" aria-hidden="true" id="diyaRow"></div>

<!-- Host settings -->
<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="hostTitle">
    <header><h2 id="hostTitle">Host settings</h2><button class="btn ghost" id="closeHost">Close</button></header>
    <div id="pinStep" class="row" style="display:grid;gap:10px">
      <label for="pin">Enter host PIN</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off">
      <p class="err" id="pinErr" hidden>That PIN isn't right. Try again.</p>
      <button class="btn" id="pinGo">Unlock</button>
    </div>
    <div id="hostBody" hidden style="display:grid;gap:14px">
      <label for="prizes">Prizes, one per line (4 to 12). Saved on this laptop.</label>
      <textarea id="prizes"></textarea>
      <div class="row"><button class="btn ghost" id="savePrizes">Update wheel</button><button class="btn ghost" id="resetPrizes">Reset to defaults</button></div>
      <p class="hint" id="prizeMsg"></p>
      <label class="switch"><input type="checkbox" id="fxToggle" checked> Fireworks in the background</label>
      <hr>
      <label for="vol">Music volume</label>
      <input type="range" id="vol" min="0" max="100" value="60">
      <label class="switch"><input type="checkbox" id="sfxToggle" checked> Wheel ticks and winner bell</label>
      <label for="ownSong">Play your own song instead (MP3 on this laptop)</label>
      <input type="file" id="ownSong" accept="audio/*">
      <div class="row"><button class="btn ghost" id="useBuiltIn">Back to built-in festival music</button></div>
      <p class="hint" id="songMsg">Playing: built-in festival music (Raag Bhupali with tabla).</p>
      <hr>
      <div class="row"><button class="btn ghost" id="clearLog">Clear winners list</button><span class="hint" id="clearMsg"></span></div>
    </div>
  </div>
</div>

<script>
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const HOST_PIN='2026';

/* ---------- Diyas ---------- */
const DIYA=`<svg viewBox="0 0 100 100"><defs>
<radialGradient id="g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffd27a" stop-opacity=".75"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>
<linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7d6"/><stop offset=".45" stop-color="#ffc23d"/><stop offset="1" stop-color="#e8601c"/></linearGradient>
<linearGradient id="c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9643a"/><stop offset="1" stop-color="#7a3216"/></linearGradient></defs>
<circle class="glow" cx="50" cy="40" r="34" fill="url(#g)"/>
<path class="flame" d="M50 14 C58 28 62 36 56 46 C53 51 47 51 44 46 C38 36 43 27 50 14Z" fill="url(#f)"/>
<path d="M50 34 C53 40 53 44 50 47 C47 44 47 40 50 34Z" fill="#fff"/>
<path d="M10 56 Q50 50 90 56 Q86 80 50 84 Q14 80 10 56Z" fill="url(#c)"/>
<path d="M10 56 Q50 50 90 56 Q50 64 10 56Z" fill="#e8a24a"/>
<path d="M22 66 Q50 74 78 66" stroke="#f6a821" stroke-width="2.5" fill="none" stroke-dasharray="2 5" stroke-linecap="round"/>
<path d="M88 55 L98 50 L92 58Z" fill="#7a3216"/></svg>`;
document.querySelectorAll('[data-diya]').forEach(d=>d.innerHTML=DIYA);
document.getElementById('diyaRow').innerHTML=Array.from({length:11},()=>`<span class="diya">${DIYA}</span>`).join('');

/* ---------- Wheel ---------- */
const DEFAULTS=["Box of mithai","Coffee on us","Diya keepsake","Chocolate treat","Team shout-out","Spin again","Gift voucher","Sparkler pack","Mystery prize","Better luck next time"];
const COLORS=['#f6a821','#e8601c','#d6336c','#7b3fb8','#2f9e6e','#c2185b','#f0c419','#3b5bdb'];
let prizes=JSON.parse(store.get('dw_prizes')||'null')||DEFAULTS.slice();
let angle=0,spinning=false;
const cv=document.getElementById('wheel'),ctx=cv.getContext('2d');
function wrapText(t,maxW){const words=t.split(' '),lines=[];let cur='';
  for(const w of words){const test=cur?cur+' '+w:w;if(ctx.measureText(test).width>maxW&&cur){lines.push(cur);cur=w}else cur=test}
  if(cur)lines.push(cur);return lines.slice(0,3)}
function draw(){const n=prizes.length,R=cv.width/2,seg=2*Math.PI/n;
  ctx.clearRect(0,0,cv.width,cv.height);ctx.save();ctx.translate(R,R);ctx.rotate(angle);
  for(let i=0;i<n;i++){const col=COLORS[i%COLORS.length];
    ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,i*seg,(i+1)*seg);ctx.closePath();ctx.fillStyle=col;ctx.fill();
    ctx.strokeStyle='rgba(255,244,220,.55)';ctx.lineWidth=3;ctx.stroke();
    ctx.save();ctx.rotate(i*seg+seg/2);ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.fillStyle=['#f6a821','#f0c419'].includes(col)?'#1b1035':'#fff4dc';
    const fs=n>8?32:38;ctx.font=`600 ${fs}px Hind, sans-serif`;
    const lines=wrapText(prizes[i],R*0.55);
    lines.forEach((l,j)=>ctx.fillText(l,R-38,(j-(lines.length-1)/2)*(fs+2)));ctx.restore();
    ctx.save();ctx.rotate(i*seg);ctx.beginPath();ctx.arc(R-15,0,8,0,7);ctx.fillStyle='#fff4dc';ctx.fill();ctx.restore();}
  ctx.restore();}
function pickIndex(){const n=prizes.length,seg=2*Math.PI/n;
  const a=((-Math.PI/2-angle)%(2*Math.PI)+4*Math.PI)%(2*Math.PI);return Math.floor(a/seg)%n}
function setBtns(d){document.getElementById('spinBtn').disabled=d;document.getElementById('hub').disabled=d}
function spin(){if(spinning)return;spinning=true;setBtns(true);
  const n=prizes.length,seg=2*Math.PI/n,target=Math.floor(Math.random()*n),jitter=(Math.random()-.5)*seg*.7;
  let final=-Math.PI/2-(target*seg+seg/2)-jitter;const turns=reduce?1:6+Math.floor(Math.random()*3);
  while(final<angle+turns*2*Math.PI)final+=2*Math.PI;
  const start=angle,dist=final-start,dur=reduce?600:5200,t0=performance.now(),ease=t=>1-Math.pow(1-t,4);
  (function frame(now){const t=Math.min(1,(now-t0)/dur);angle=start+dist*ease(t);draw();tickCheck();
    if(t<1)requestAnimationFrame(frame);else{angle%=2*Math.PI;finish(pickIndex())}})(t0)}
let log=JSON.parse(store.get('dw_log')||'[]');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function finish(i){spinning=false;setBtns(false);const p=prizes[i],nm=document.getElementById('name').value.trim();
  const lose=/better luck|try again/i.test(p);
  document.getElementById('result').innerHTML=`<div class="who">${nm?esc(nm)+(lose?'…':' wins'):(lose?'So close':'You win')}</div><div class="prize">${esc(p)}</div>`;
  if(!lose){celebrate();winSound()}
  log.unshift({n:nm||'Colleague',p,t:new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})});log=log.slice(0,60);
  store.set('dw_log',JSON.stringify(log));renderLog();document.getElementById('name').value=''}
function renderLog(){document.getElementById('log').innerHTML=log.length?log.map(r=>`<li><span>${esc(r.n)} <small>${r.t}</small></span><span>${esc(r.p)}</span></li>`).join(''):'<li><span>No spins yet. Be the first!</span><span></span></li>'}
document.getElementById('spinBtn').onclick=spin;document.getElementById('hub').onclick=spin;
document.fonts?.ready.then(draw);draw();renderLog();

/* ---------- Host settings ---------- */
const ov=document.getElementById('overlay'),ta=document.getElementById('prizes');
let unlocked=false;
function openHost(){ov.hidden=false;document.getElementById('pinStep').hidden=unlocked;document.getElementById('hostBody').hidden=!unlocked;
  document.getElementById('pinErr').hidden=true;ta.value=prizes.join('\n');document.getElementById('prizeMsg').textContent='';document.getElementById('clearMsg').textContent='';
  setTimeout(()=>(unlocked?ta:document.getElementById('pin')).focus(),30)}
function closeHost(){ov.hidden=true;unlocked=false;document.getElementById('pin').value=''}
document.getElementById('hostBtn').onclick=openHost;document.getElementById('closeHost').onclick=closeHost;
ov.addEventListener('click',e=>{if(e.target===ov)closeHost()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!ov.hidden)closeHost()});
function tryPin(){if(document.getElementById('pin').value===HOST_PIN){unlocked=true;openHost()}else document.getElementById('pinErr').hidden=false}
document.getElementById('pinGo').onclick=tryPin;document.getElementById('pin').addEventListener('keydown',e=>{if(e.key==='Enter')tryPin()});
document.getElementById('savePrizes').onclick=()=>{const list=ta.value.split('\n').map(s=>s.trim()).filter(Boolean),msg=document.getElementById('prizeMsg');
  if(list.length<4||list.length>12){msg.textContent=`You have ${list.length} prizes. Use between 4 and 12 so the slices stay readable.`;return}
  prizes=list;store.set('dw_prizes',JSON.stringify(prizes));draw();msg.textContent='Wheel updated.'};
document.getElementById('resetPrizes').onclick=()=>{prizes=DEFAULTS.slice();ta.value=prizes.join('\n');store.set('dw_prizes',JSON.stringify(prizes));draw();document.getElementById('prizeMsg').textContent='Back to the default prizes.'};
document.getElementById('clearLog').onclick=()=>{log=[];store.set('dw_log','[]');renderLog();document.getElementById('clearMsg').textContent='Winners list cleared.'};
const fxT=document.getElementById('fxToggle');let ambient=store.get('dw_fx')!=='off';fxT.checked=ambient;
fxT.onchange=()=>{ambient=fxT.checked;store.set('dw_fx',ambient?'on':'off')};

/* ---------- Fireworks: rockets, anar (flower pots), chakri, phuljhari ---------- */
const fx=document.getElementById('fx'),g=fx.getContext('2d');let W,H,DPR;
function size(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;fx.width=W*DPR;fx.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',size);size();
const PAL=[['#ffd27a','#fff4dc'],['#ff6b3d','#ffd27a'],['#ff4f8b','#ffc0d6'],['#7cf0b0','#e6fff2'],['#8fb3ff','#ffffff'],['#c78bff','#ffe1ff'],['#f6a821','#e8601c']];
let P=[],E=[],R=[];const MAXP=1600;
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
function spark(x,y,vx,vy,c,life,o={}){if(P.length>=MAXP)return;P.push({x,y,px:x,py:y,vx,vy,c,life,max:life,g:o.g??.05,drag:o.drag??.985,w:o.w??2,tw:o.tw||0})}
function rocket(x){R.push({x:x??rnd(W*.1,W*.9),y:H+10,vx:rnd(-.8,.8),vy:-rnd(H*.0105+6,H*.012+8),c:pick(PAL),type:pick(['peony','peony','ring','willow','crackle'])})}
function explode(r){const [c1,c2]=r.c,n=r.type==='ring'?70:r.type==='willow'?90:110;
  for(let i=0;i<n;i++){const a=r.type==='ring'?i/n*Math.PI*2:rnd(0,Math.PI*2),s=r.type==='ring'?4.2:rnd(1,r.type==='willow'?3.2:5.5);
    const c=r.type==='willow'?'#ffcf6b':(Math.random()<.7?c1:c2);
    spark(r.x,r.y,Math.cos(a)*s,Math.sin(a)*s,c,r.type==='willow'?rnd(90,130):rnd(55,85),{g:r.type==='willow'?.035:.05,drag:r.type==='willow'?.975:.982,w:2.2,tw:r.type==='crackle'||Math.random()<.25?1:0})}
  if(r.type==='crackle')setTimeout(()=>{for(let i=0;i<40;i++)spark(r.x+rnd(-90,90),r.y+rnd(-60,90),rnd(-1,1),rnd(-1,1),'#fff',rnd(10,22),{g:0,w:2.6,tw:1})},500)}
function anar(x){E.push({kind:'anar',x:x??rnd(W*.08,W*.92),y:H-6,t:0,dur:rnd(180,260)})}
function chakri(x){E.push({kind:'chakri',x:x??rnd(W*.1,W*.9),y:H-rnd(20,60),t:0,dur:rnd(160,220),a:0})}
function phuljhari(){const x=rnd(W*.1,W*.9),y=rnd(H*.25,H*.75);E.push({kind:'phul',x,y,ox:x,oy:y,t:0,dur:rnd(150,230),r:rnd(20,60)})}
function runEmitters(){E=E.filter(e=>{e.t++;const k=e.t/e.dur;
  if(e.kind==='anar'){const pw=Math.sin(Math.min(1,k)*Math.PI);
    for(let i=0;i<10*pw+2;i++){const a=-Math.PI/2+rnd(-.32,.32),s=rnd(4,9)*pw+1.5;spark(e.x,e.y,Math.cos(a)*s,Math.sin(a)*s,pick(['#fff4dc','#ffd27a','#ffb347','#ffffff']),rnd(30,60),{g:.13,drag:.99,w:1.8,tw:Math.random()<.3?1:0})}
    g.fillStyle='#7a3216';g.beginPath();g.moveTo(e.x-12,e.y+6);g.lineTo(e.x+12,e.y+6);g.lineTo(e.x+5,e.y-10);g.lineTo(e.x-5,e.y-10);g.fill()}
  else if(e.kind==='chakri'){e.a+=.45;for(let j=0;j<3;j++){const a=e.a+j*2.09;
      spark(e.x+Math.cos(a)*8,e.y+Math.sin(a)*8,Math.cos(a+1.4)*rnd(3,5),Math.sin(a+1.4)*rnd(3,5),pick(['#ffd27a','#fff','#7cf0b0','#ff6b3d']),rnd(18,30),{g:.08,drag:.95,w:1.8})}}
  else{e.x=e.ox+Math.cos(e.t*.05)*e.r;e.y=e.oy+Math.sin(e.t*.08)*e.r*.5;
    for(let i=0;i<7;i++){const a=rnd(0,Math.PI*2),s=rnd(1.5,4.5);spark(e.x,e.y,Math.cos(a)*s,Math.sin(a)*s,Math.random()<.8?'#fffbe8':'#ffd27a',rnd(6,16),{g:.02,drag:.9,w:1.4,tw:1})}
    g.fillStyle='rgba(255,250,220,.9)';g.beginPath();g.arc(e.x,e.y,3,0,7);g.fill()}
  return e.t<e.dur})}
let next=performance.now()+800;
function schedule(now){if(!ambient||reduce||document.hidden||now<next)return;
  const r=Math.random();if(r<.45)rocket();else if(r<.65)anar();else if(r<.82)chakri();else phuljhari();
  if(Math.random()<.25)setTimeout(()=>rocket(),250);
  next=now+rnd(700,1900)}
function loop(now){g.clearRect(0,0,W,H);g.globalCompositeOperation='lighter';schedule(now);
  R=R.filter(r=>{r.x+=r.vx;r.y+=r.vy;r.vy+=.12;g.fillStyle=r.c[1];g.beginPath();g.arc(r.x,r.y,2.4,0,7);g.fill();
    spark(r.x,r.y+4,rnd(-.4,.4),rnd(.5,1.5),'#ffb347',rnd(12,22),{g:.02,w:1.4});
    if(r.vy>=-.5){explode(r);return false}return true});
  runEmitters();
  for(const p of P){p.px=p.x;p.py=p.y;p.vx*=p.drag;p.vy=p.vy*p.drag+p.g;p.x+=p.vx;p.y+=p.vy;p.life--;
    let a=Math.max(0,p.life/p.max);if(p.tw)a*=Math.random()<.5?1:.2;
    g.globalAlpha=a;g.strokeStyle=p.c;g.lineWidth=p.w;g.beginPath();g.moveTo(p.px,p.py);g.lineTo(p.x,p.y);g.stroke()}
  g.globalAlpha=1;g.globalCompositeOperation='source-over';P=P.filter(p=>p.life>0);
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);
function celebrate(){if(reduce)return;for(let i=0;i<5;i++)setTimeout(()=>rocket(W*(.15+.175*i)),i*160);anar(W*.2);anar(W*.8);chakri(W*.5)}

/* ---------- Music & sound (all generated in the browser) ---------- */
let AC=null,master,musicBus,sfxBus,playing=false,timer=null,nextT=0,step=0,phrase=[],ownAudio=null,ownURL=null;
let vol=+(store.get('dw_vol')??60),sfxOn=store.get('dw_sfx')!=='off';
const SA=146.83; // D
const RAT=[1,9/8,5/4,3/2,5/3]; // Bhupali: Sa Re Ga Pa Dha
const noteF=i=>{const o=Math.floor(i/5),d=((i%5)+5)%5;return SA*2*RAT[d]*Math.pow(2,o)};
const bufCache={};
function ensureAudio(){if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.connect(AC.destination);
  const comp=AC.createDynamicsCompressor();comp.connect(master);
  musicBus=AC.createGain();musicBus.connect(comp);sfxBus=AC.createGain();sfxBus.connect(comp);applyVol()}
function applyVol(){if(!AC)return;musicBus.gain.value=(vol/100)*.9;sfxBus.gain.value=sfxOn?.8:0;if(ownAudio)ownAudio.volume=vol/100}
function pluckBuf(f,dur,decay,bright){const key=f.toFixed(2)+dur+decay;if(bufCache[key])return bufCache[key];
  const sr=AC.sampleRate,len=Math.floor(sr*dur),b=AC.createBuffer(1,len,sr),d=b.getChannelData(0),N=Math.max(2,Math.round(sr/f));
  for(let i=0;i<N;i++)d[i]=(Math.random()*2-1)*(i<N*bright?1:.4);
  for(let i=N+1;i<len;i++){let y=decay*.5*(d[i-N]+d[i-N-1]);if(Math.abs(y)>.32)y*=.9;d[i]=y} // slight clip = sitar buzz
  return bufCache[key]=b}
function pluck(f,t,g=.5,dur=2.2,decay=.997,dest=musicBus,detune=0){const s=AC.createBufferSource();s.buffer=pluckBuf(f,dur,decay,.6);s.detune.value=detune;
  const v=AC.createGain();v.gain.value=g;s.connect(v);v.connect(dest);s.start(t)}
function tone(f,t,g,dec,type='sine',f2=null,dest=musicBus){const o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dec*.6);v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.005);
  v.gain.exponentialRampToValueAtTime(.0001,t+dec);o.connect(v);v.connect(dest);o.start(t);o.stop(t+dec+.05)}
function noise(t,g,dec,hp=2000,dest=musicBus){const len=Math.floor(AC.sampleRate*dec),b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);const s=AC.createBufferSource();s.buffer=b;
  const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const v=AC.createGain();v.gain.value=g;s.connect(f);f.connect(v);v.connect(dest);s.start(t)}
/* tabla bols */
const ge=(t,g=.55)=>tone(78,t,g,.5,'sine',112);
const na=(t,g=.28)=>{tone(SA*2,t,g,.3);tone(SA*4,t,g*.4,.18);noise(t,g*.25,.03,3000)};
const ti=(t,g=.18)=>noise(t,g,.06,1800);
const tun=(t,g=.25)=>tone(SA*2,t,g,.7);
const KEHERWA=[t=>{ge(t);na(t)},t=>ge(t,.35),t=>na(t),t=>ti(t),t=>na(t,.22),t=>ti(t,.12),t=>{ge(t,.45);tun(t)},t=>na(t)];
function newPhrase(){const p=[];let i=Math.random()<.5?5:7;const len=8+Math.floor(Math.random()*5);
  for(let k=0;k<len;k++){const r=Math.random();if(r<.12){p.push(null);continue}
    i+=r<.45?1:r<.85?-1:(Math.random()<.5?2:-2);i=Math.max(2,Math.min(11,i));p.push(i)}
  p.push(Math.random()<.6?5:8,null,null);return p}
const BEAT=.32; // seconds per matra
function schedMusic(){while(nextT<AC.currentTime+.25){const t=nextT,m=step%8;
    KEHERWA[m](t);
    if(m===0||m===4){pluck(SA*.75,t,.22,4,.9985);} // Pa (low)
    if(m===2||m===6){pluck(SA,t,.2,4,.9985);pluck(SA,t+BEAT*.5,.16,4,.9985,musicBus,4)}
    if(step%2===0){if(!phrase.length)phrase=newPhrase();const n=phrase.shift();
      if(n!=null){pluck(noteF(n),t,.42,2.2,.996);if(Math.random()<.3&&phrase[0]!=null)pluck(noteF(n),t+BEAT*.5,.3,1.6,.995,musicBus,-25)}}
    step++;nextT+=BEAT}}
function startMusic(){ensureAudio();if(AC.state!=='running'){AC.resume().then(()=>{if(playing&&!ownAudio){nextT=AC.currentTime+.1}})}
  if(ownAudio){ownAudio.volume=vol/100;ownAudio.play().catch(()=>{})}
  else{nextT=AC.currentTime+.1;step=0;phrase=[];schedMusic();timer=setInterval(schedMusic,40)}
  playing=true;updateBtn()}
function stopMusic(){clearInterval(timer);timer=null;if(ownAudio)ownAudio.pause();playing=false;updateBtn()}
function updateBtn(){const b=document.getElementById('musicBtn');b.setAttribute('aria-pressed',playing);b.textContent=playing?'♪ Pause music':'♪ Music'}
document.getElementById('musicBtn').onclick=()=>playing?stopMusic():startMusic();
/* sound effects */
let lastSeg=null;
function tickCheck(){if(!AC||!sfxOn)return;const seg=Math.floor(angle/(2*Math.PI/prizes.length));
  if(lastSeg!==null&&seg!==lastSeg){const t=AC.currentTime;tone(1800,t,.18,.04,'triangle',null,sfxBus)}lastSeg=seg}
function winSound(){if(!AC||!sfxOn)return;const t=AC.currentTime;
  [1,2.76,5.4,8.93].forEach((h,i)=>tone(SA*4*h,t,.25/(i+1),2.4,'sine',null,sfxBus)); // temple bell
  [0,1,2,3,4,5,7,8].forEach((n,i)=>pluck(noteF(n+5),t+.15+i*.09,.35,2,.996,sfxBus))}
document.getElementById('spinBtn').addEventListener('click',()=>{ensureAudio();AC.resume()},true);
document.getElementById('hub').addEventListener('click',()=>{ensureAudio();AC.resume()},true);
/* host controls */
const volEl=document.getElementById('vol'),sfxEl=document.getElementById('sfxToggle');volEl.value=vol;sfxEl.checked=sfxOn;
volEl.oninput=()=>{vol=+volEl.value;store.set('dw_vol',vol);applyVol()};
sfxEl.onchange=()=>{sfxOn=sfxEl.checked;store.set('dw_sfx',sfxOn?'on':'off');applyVol()};
document.getElementById('ownSong').onchange=e=>{const f=e.target.files[0];if(!f)return;const was=playing;stopMusic();
  if(ownURL)URL.revokeObjectURL(ownURL);ownURL=URL.createObjectURL(f);ownAudio=new Audio(ownURL);ownAudio.loop=true;
  document.getElementById('songMsg').textContent='Playing: '+f.name+' (on repeat). Choose it again after reloading the page.';if(was)startMusic()};
document.getElementById('useBuiltIn').onclick=()=>{const was=playing;stopMusic();if(ownAudio){ownAudio.pause();ownAudio=null}
  document.getElementById('ownSong').value='';document.getElementById('songMsg').textContent='Playing: built-in festival music (Raag Bhupali with tabla).';if(was)startMusic()};
</script>
